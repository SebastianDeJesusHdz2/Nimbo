name: Nimbo desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: Nimbo.Desktop.exe
          - os: ubuntu-24.04
            rid: linux-x64
            exe: Nimbo.Desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verificar biblioteca e intercambio LaTeX
        run: dotnet run --project tests/Nimbo.Checks -c Release
      - name: Verificar libro ilustrado y glosario A6 con XeLaTeX
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended poppler-utils
          NIMBO_SAMPLE_ART="$GITHUB_WORKSPACE/src/Nimbo.Desktop/Art" NIMBO_SAMPLE_DIR="$RUNNER_TEMP/CV" dotnet run --project tests/Nimbo.Checks -c Release -- --pdf
      - name: Comprobar la paginación de las fichas de bolsillo
        if: runner.os == 'Linux'
        run: |
          pocket="$RUNNER_TEMP/CV/Cuadernillo de bolsillo.pdf"
          card="$RUNNER_TEMP/CV/Ficha de Mara Vélez.pdf"
          pdfinfo "$pocket"
          test "$(pdfinfo "$pocket" | awk '/^Pages:/ {print $2}')" = 5
          test "$(pdfinfo "$card" | awk '/^Pages:/ {print $2}')" = 1
          pdftotext -f 3 -l 3 "$pocket" - | grep -F 'Notas de autor'
          pdftotext -f 5 -l 5 "$pocket" - | grep -F 'Contiene'
          pdftohtml -q -xml -stdout "$RUNNER_TEMP/CV/Figuras ajustadas.pdf" "$RUNNER_TEMP/ajuste" > "$RUNNER_TEMP/ajuste.xml"
          python3 - "$RUNNER_TEMP/ajuste.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          pages = ET.parse(sys.argv[1]).getroot().findall("page")
          figures = [(p, image) for p in pages for image in p.findall("image")]
          assert len(figures) == 12, f"Ilustraciones impresas: {len(figures)}"
          for page, image in figures:
              bottom = int(image.get("top")) + int(image.get("height"))
              assert bottom < int(page.get("height")) * .90, f"Figura sobre el pie de la página {page.get('number')}"
          PY
      - name: Publicar escritorio
        run: dotnet publish src/Nimbo.Desktop -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/app
      - name: Abrir la biblioteca en Linux
        if: runner.os == 'Linux'
        run: NIMBO_UI_CAPTURE="$RUNNER_TEMP/Biblioteca.png" xvfb-run -a -s "-screen 0 1920x1080x24" artifacts/app/Nimbo.Desktop --verify-ui
      - name: Comprobar edición, lectura, glosario y preferencias
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/vistas"
          NIMBO_VIEW_SAMPLES="$RUNNER_TEMP/vistas" xvfb-run -a -s "-screen 0 1920x1080x24" artifacts/app/Nimbo.Desktop --verify-editors
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: Diagnostico-editor
          path: ${{ runner.temp }}/vistas
          retention-days: 3
      - name: Abrir la biblioteca en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process artifacts/app/Nimbo.Desktop.exe -ArgumentList '--verify-ui' -PassThru -Wait -WindowStyle Hidden
          if($process.ExitCode -ne 0){exit $process.ExitCode}
          $edit = Start-Process artifacts/app/Nimbo.Desktop.exe -ArgumentList '--verify-editors' -PassThru -Wait -WindowStyle Hidden
          exit $edit.ExitCode
      - name: Instalar empaquetador
        run: dotnet tool install --tool-path tools vpk --version 1.2.161
      - name: Preparar versión
        shell: bash
        run: |
          version="$(dotnet msbuild src/Nimbo.Desktop/Nimbo.Desktop.csproj -getProperty:Version | tr -d '\r')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "$version" = "${GITHUB_REF_NAME#v}"; fi
          printf '%s\n' "Nimbo · GPL-3.0-only" "https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" > artifacts/app/FUENTES.txt
          test -s artifacts/app/LICENSE
          ./tools/vpk pack --packId Nimbo --packTitle Nimbo --packVersion "$version" --runtime ${{ matrix.rid }} --packDir artifacts/app --mainExe ${{ matrix.exe }} --outputDir artifacts/release
      - if: runner.os == 'Linux'
        run: cp -r packaging/instalar-linux.sh "$RUNNER_TEMP/Biblioteca.png" "$RUNNER_TEMP/vistas" "$RUNNER_TEMP/CV" artifacts/release/
      - name: Instalar y abrir desde el escritorio de Linux
        if: runner.os == 'Linux'
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/nimbo-user"
          sh packaging/instalar-linux.sh artifacts/release/Nimbo.AppImage
          test -f "$XDG_DATA_HOME/applications/nimbo.desktop"
          xvfb-run -a "$XDG_DATA_HOME/Nimbo/Nimbo.AppImage" --appimage-extract-and-run --verify-ui
      - name: Instalar y abrir la edición distribuida de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup=(Get-ChildItem artifacts/release/*Setup.exe).FullName
          $install=Start-Process -FilePath $setup -ArgumentList '--silent' -PassThru -Wait -WindowStyle Hidden
          if($install.ExitCode -ne 0){exit $install.ExitCode}
          $app=Join-Path $env:LOCALAPPDATA 'Nimbo/current/Nimbo.Desktop.exe'
          $opened=Start-Process -FilePath $app -ArgumentList '--verify-ui' -PassThru -Wait -WindowStyle Hidden
          exit $opened.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: Nimbo-${{ matrix.rid }}
          path: artifacts/release/
          retention-days: 3
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Preparar borrador de distribución
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(packages/*/*.exe packages/*/*.AppImage packages/*/*.nupkg packages/*/releases.*.json packages/*/*.sh)
          channel=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then channel+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --draft "${channel[@]}" --title "Nimbo ${GITHUB_REF_NAME#v}"










